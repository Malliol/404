<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Станция восстанавливается — 80%</title>
<style>
  :root {
    --bg: #050505;
    --white: #f2f2f0;
    --grey-1: #b8b8b4;
    --grey-2: #6a6a68;
    --grey-3: #2a2a29;
    --line: #3a3a38;
    --track: #201f1e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: 'Courier New', ui-monospace, Consolas, monospace;
    overflow: hidden;
  }

  body {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  /* Звёздное поле */
  .stars {
    position: absolute;
    inset: 0;
    z-index: 0;
  }
  .stars span {
    position: absolute;
    background: var(--white);
    border-radius: 50%;
    opacity: 0.6;
  }
  .stars span.twinkle {
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle {
    0%, 100% { opacity: 0.15; }
    50% { opacity: 0.9; }
  }

  .scene {
    position: relative;
    z-index: 2;
    width: min(92vw, 640px);
    text-align: center;
  }

  .code {
    font-size: clamp(2.6rem, 9vw, 4.2rem);
    font-weight: 700;
    letter-spacing: 0.1em;
    line-height: 1;
    margin-bottom: 0.6rem;
  }

  .status {
    font-size: 0.78rem;
    letter-spacing: 0.14em;
    color: var(--grey-2);
    margin-bottom: 0.6rem;
  }

  .headline {
    font-size: clamp(1.4rem, 5.4vw, 2.2rem);
    font-weight: 700;
    letter-spacing: 0.02em;
    line-height: 1.15;
    margin-bottom: 0.5rem;
  }

  .message {
    font-size: 0.92rem;
    color: var(--grey-1);
    letter-spacing: 0.03em;
    line-height: 1.6;
    margin-bottom: 2rem;
  }

  /* Орбитальная область с кольцом-прогрессом */
  .orbit-field {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 0 auto;
  }

  .ring-svg {
    width: 100%;
    height: 100%;
    transform: rotate(-90deg);
  }

  .ring-track {
    fill: none;
    stroke: var(--track);
    stroke-width: 10;
  }

  .ring-fill {
    fill: none;
    stroke: var(--white);
    stroke-width: 10;
    stroke-linecap: round;
    stroke-dasharray: 754;
    stroke-dashoffset: 754;
    animation: fillRing 1.8s ease-out 0.3s forwards;
  }

  @keyframes fillRing {
    to { stroke-dashoffset: 407.16; } /* 754 * (1 - 0.80) */
  }

  /* Маленькие планеты, вращающиеся вокруг кольца */
  .satellites {
    position: absolute;
    inset: 0;
  }

  .sat {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 10px;
    height: 10px;
    margin: -5px 0 0 -5px;
    border-radius: 50%;
  }

  .sat-1 {
    background: radial-gradient(circle at 32% 28%, #fdfdfb, #8a8a86 55%, #1c1c1b 90%);
    animation: orbit1 14s linear infinite;
  }
  .sat-2 {
    width: 7px; height: 7px; margin: -3.5px 0 0 -3.5px;
    background: radial-gradient(circle at 32% 28%, #eaeae7, #6a6a67 60%, #151514 90%);
    animation: orbit2 21s linear infinite reverse;
  }
  .sat-3 {
    width: 13px; height: 13px; margin: -6.5px 0 0 -6.5px;
    background: radial-gradient(circle at 32% 28%, #fdfdfb, #75756f 55%, #131312 90%);
    animation: orbit3 32s linear infinite;
  }

  @keyframes orbit1 {
    from { transform: rotate(0deg) translateX(158px) rotate(0deg); }
    to   { transform: rotate(360deg) translateX(158px) rotate(-360deg); }
  }
  @keyframes orbit2 {
    from { transform: rotate(0deg) translateX(180px) rotate(0deg); }
    to   { transform: rotate(360deg) translateX(180px) rotate(-360deg); }
  }
  @keyframes orbit3 {
    from { transform: rotate(0deg) translateX(200px) rotate(0deg); }
    to   { transform: rotate(360deg) translateX(200px) rotate(-360deg); }
  }

  .center-readout {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  .center-readout .pct {
    font-size: 2.6rem;
    font-weight: 700;
  }
  .center-readout .pct::after {
    content: "%";
    font-size: 0.55em;
    color: var(--grey-1);
    margin-left: 2px;
  }
  .center-readout .updated {
    margin-top: 0.35rem;
    font-size: 0.62rem;
    letter-spacing: 0.08em;
    color: var(--grey-2);
  }

  .coords {
    margin-top: 1.8rem;
    font-size: 0.7rem;
    color: var(--grey-2);
    letter-spacing: 0.08em;
  }

  @media (prefers-reduced-motion: reduce) {
    .sat, .stars span.twinkle { animation: none !important; }
    .ring-fill { animation: none !important; stroke-dashoffset: 407.16; }
  }
</style>
</head>
<body>

  <div class="stars" id="stars"></div>

  <div class="scene">
    <div class="code">404</div>
    <div class="status">СТАТУС СИСТЕМЫ</div>
    <div class="headline">Восстановление системы</div>

    <div class="orbit-field">
      <svg class="ring-svg" viewBox="0 0 260 260">
        <circle class="ring-track" cx="130" cy="130" r="120"></circle>
        <circle class="ring-fill" cx="130" cy="130" r="120"></circle>
      </svg>

      <div class="satellites">
        <div class="sat sat-1"></div>
        <div class="sat sat-2"></div>
        <div class="sat sat-3"></div>
      </div>

      <div class="center-readout">
        <div class="pct">80</div>
        <div class="updated">ВОССТАНОВЛЕНО</div>
      </div>
    </div>

    <p class="coords">ОЖИДАЕМОЕ ЗАВЕРШЕНИЕ: НЕИЗВЕСТНО</p>
  </div>

  <script>
    const field = document.getElementById('stars');
    const total = 110;
    for (let i = 0; i < total; i++) {
      const s = document.createElement('span');
      const size = Math.random() * 2 + 0.6;
      s.style.width = size + 'px';
      s.style.height = size + 'px';
      s.style.top = Math.random() * 100 + '%';
      s.style.left = Math.random() * 100 + '%';
      if (Math.random() > 0.6) {
        s.classList.add('twinkle');
        s.style.animationDelay = (Math.random() * 4) + 's';
      }
      field.appendChild(s);
    }

    // Подтягиваем актуальную ставку из bot/rates.json
    const CIRCUMFERENCE = 754;
    const ringFill = document.querySelector('.ring-fill');
    const pctEl = document.querySelector('.center-readout .pct');

    function applyRate(rate) {
      const clamped = Math.max(0, Math.min(100, rate));
      const offset = CIRCUMFERENCE * (1 - clamped / 100);
      ringFill.style.animation = 'none';
      ringFill.style.strokeDashoffset = offset;
      pctEl.textContent = clamped;
    }

    fetch('bot/rates.json?t=' + Date.now())
      .then(r => r.ok ? r.json() : null)
      .then(data => {
        if (data && typeof data.rate === 'number') {
          applyRate(data.rate);
        }
      })
      .catch(() => { /* оставляем значение по умолчанию из разметки */ });
  </script>

</body>
</html>
